<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Team Feedback Tool{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {# Page styles: each page brings its own <style> element. Never render this
       block inside another <style>: the stray "<style>" text would invalidate
       the page's first CSS rule. #}
    {% block extra_styles %}{% endblock %}

    <!-- Copy-for-Workday text format (WorkdayFormat.peer / .manager) -->
    <script src="{{ url_for('static', filename='workday_format.js') }}"></script>
    <!-- Tenet selection grids and checklist (TenetPicker.create) -->
    <script src="{{ url_for('static', filename='tenet_picker.js') }}"></script>

    <!-- Global Auto-Save Manager: Handles debounced saves with keepalive on page unload -->
    <script>
    window.AutoSave = (function() {
        const DELAY_MS = 2000;
        const pending = {};  // { id: { timer, url, data, onSaved } }
        let hideTimer = null;

        // Report the outcome on the page's #saveIndicator (inline, never a popup).
        // Success fades out; failure stays visible until the next successful save.
        function showStatus(ok, message) {
            const indicator = document.getElementById('saveIndicator');
            if (!indicator) return;
            clearTimeout(hideTimer);
            indicator.textContent = ok ? '✓ Saved' : '✗ Not saved: ' + message;
            indicator.classList.toggle('error', !ok);
            indicator.classList.add('show');
            if (ok) {
                hideTimer = setTimeout(() => indicator.classList.remove('show'), 2000);
            }
        }

        function send(entry) {
            fetch(entry.url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(entry.data)
            })
            .then(r => r.json().then(body => {
                if (!r.ok || !body.success) {
                    throw new Error(body.error || `HTTP ${r.status}`);
                }
                showStatus(true);
                if (entry.onSaved) entry.onSaved(entry.data);
            }))
            .catch(err => {
                console.error('Auto-save failed:', err);
                showStatus(false, err.message);
            });
        }

        // Flush all pending saves on page unload; keepalive lets the request
        // outlive the page, but its response can no longer be shown.
        window.addEventListener('beforeunload', function() {
            Object.keys(pending).forEach(id => {
                const entry = pending[id];
                clearTimeout(entry.timer);
                fetch(entry.url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(entry.data),
                    keepalive: true
                }).catch(() => {});
                delete pending[id];
            });
        });

        return {
            /**
             * Schedule a debounced save that survives page navigation.
             *
             * The data is captured now, not when the timer fires, so a save
             * always sends the state it was scheduled for even if the page
             * has moved on (e.g. the user picked another colleague).
             *
             * @param {string} id - Unique identifier for this save operation
             * @param {string} url - API endpoint to POST to
             * @param {object} data - Payload to save (last call within the delay wins)
             * @param {function} [onSaved] - Called with the payload once the server confirms
             */
            debounce: function(id, url, data, onSaved) {
                if (pending[id]) {
                    clearTimeout(pending[id].timer);
                }
                const entry = { url: url, data: data, onSaved: onSaved };
                entry.timer = setTimeout(() => {
                    delete pending[id];
                    send(entry);
                }, DELAY_MS);
                pending[id] = entry;
            },

            /**
             * Cancel a pending save without executing it.
             * @param {string} id - The save operation ID to cancel
             */
            cancel: function(id) {
                if (pending[id]) {
                    clearTimeout(pending[id].timer);
                    delete pending[id];
                }
            },

            /**
             * Drop every pending save, e.g. before the underlying data is replaced.
             */
            cancelAll: function() {
                Object.keys(pending).forEach(id => this.cancel(id));
            },

            /**
             * Immediately execute a pending save (useful for blur events).
             * @param {string} id - The save operation ID to flush
             */
            flush: function(id) {
                if (pending[id]) {
                    const entry = pending[id];
                    clearTimeout(entry.timer);
                    delete pending[id];
                    send(entry);
                }
            }
        };
    })();

    // '1 entry', '3 entries': plural(n, 'entry', 'entries'); the plural defaults to word + 's'
    function plural(count, singular, pluralWord) {
        return `${count} ${count === 1 ? singular : (pluralWord || singular + 's')}`;
    }

    // Escape text for interpolation into innerHTML templates.
    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }
    </script>
</head>
<body>
    {% if demo_mode %}
    <!-- Sticky Demo Mode Banner -->
    <div class="mode-banner">
        <div class="mode-banner-content">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span><span class="mode-banner-label">DEMO MODE</span> - All data shown is fictitious sample data.</span>
            <button type="button" id="demoResetBtn" class="demo-reset" onclick="resetDemo(this)"
                    title="Discard your changes and restore the sample data">Reset demo data</button>
            <a href="https://github.com/adereis/team-feedback-tool" target="_blank" class="mode-banner-link">Get the real tool</a>
        </div>
    </div>
    {% elif hosted_mode %}
    <!-- Sticky Hosted Mode Banner -->
    <div class="mode-banner">
        <div class="mode-banner-content">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span><span class="mode-banner-label">HOSTED MODE</span> - No data is stored. Import and CSV features disabled.</span>
            <a href="https://github.com/adereis/team-feedback-tool" target="_blank" class="mode-banner-link">Get the real tool</a>
        </div>
    </div>
    {% endif %}
    <header>
        <div class="container">
            <h1>Team Feedback Tool</h1>
            <nav>
                {% if hosted_mode and not demo_mode %}
                <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}class="active"{% endif %}>Home</a>
                <a href="{{ url_for('feedback_for_workday') }}" {% if request.endpoint == 'feedback_for_workday' %}class="active"{% endif %}>Give Feedback</a>
                {% else %}
                {# views: the shared routes' blueprint for this mode, 'local' or 'demo' #}
                <a href="{{ url_for(home_endpoint) }}" {% if request.endpoint in ['index', 'demo_index'] %}class="active"{% endif %}>Home</a>
                <a href="{{ url_for(views ~ '.individual_feedback') }}" {% if request.endpoint == views ~ '.individual_feedback' %}class="active"{% endif %}>Individual Feedback</a>
                <a href="{{ url_for(views ~ '.manager_dashboard') }}" {% if request.endpoint in [views ~ '.manager_dashboard', views ~ '.view_report'] %}class="active"{% endif %}>Manager Dashboard</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script>
    // Root of the shared routes: '' locally, '/demo' in demo mode. Build URLs from
    // it (never hard-code '/demo'); in Jinja use url_for(views ~ '.endpoint').
    const VIEWS_ROOT = {{ views_root | tojson }};
    const API_PREFIX = VIEWS_ROOT + '/api';
    {% if demo_mode %}

    // Banner button: restore this visitor's sandbox to the sample data
    async function resetDemo(button) {
        // Pending saves belong to the data being discarded. The server would reject
        // them anyway (reset signs the visitor out), so this just skips the requests.
        window.AutoSave.cancelAll();
        button.disabled = true;
        button.textContent = 'Resetting…';
        try {
            const response = await fetch(API_PREFIX + '/reset', { method: 'POST' });
            const body = await response.json();
            if (!response.ok || !body.success) {
                throw new Error(body.error || `HTTP ${response.status}`);
            }
            window.location.href = VIEWS_ROOT;  // demo home: the reset also signed the visitor out
        } catch (err) {
            console.error('Demo reset failed:', err);
            button.disabled = false;
            button.textContent = 'Reset failed, try again';
        }
    }
    {% endif %}
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
